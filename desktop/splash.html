<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khởi động - Hệ Thống Quản Lý Khảo Thí</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 28px;
      -webkit-app-region: drag;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.12);
    }
    .brand-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 24px -4px rgba(37, 99, 235, 0.35);
      margin-bottom: 18px;
      flex-shrink: 0;
    }
    .brand-icon svg {
      width: 36px;
      height: 36px;
      color: #ffffff;
    }
    h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      color: #020617;
      text-align: center;
    }
    p.subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #475569;
      margin-bottom: 24px;
      text-align: center;
    }
    .progress-container {
      width: 100%;
      max-width: 320px;
      height: 6px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #2563eb, #3b82f6);
      border-radius: 9999px;
      animation: indeterminate 1.8s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% {
        left: -40%;
        width: 30%;
      }
      50% {
        left: 30%;
        width: 60%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }
    .status-text {
      font-size: 12.5px;
      font-weight: 500;
      color: #64748b;
      text-align: center;
    }
    .version-tag {
      margin-top: 14px;
      font-size: 11px;
      font-weight: 500;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="brand-icon">
    <!-- GraduationCap Icon chính thức của hệ thống khảo thí -->
    <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/>
      <path d="M22 10v6"/>
      <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
    </svg>
  </div>
  <h1>Hệ Thống Quản Lý Khảo Thí</h1>
  <p class="subtitle">Exam Management System</p>
  
  <div class="progress-container">
    <div class="progress-bar"></div>
  </div>
  
  <div class="status-text" id="status">Đang khởi động dịch vụ và nạp dữ liệu...</div>
  <div class="version-tag">Phiên bản Desktop 1.0.0</div>
</body>
</html>
